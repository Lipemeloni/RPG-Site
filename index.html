<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>RPG: Lendas de Eldoria</title>
	<style>
		:root{color-scheme:dark;--gold:#f0c66a;--text:#eee7d7;--muted:#b9b6aa;--panel:#171d24;--line:#695a3c}
		*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#52604b,#222c30 48%,#11161b 83%);color:var(--text);font:15px system-ui,sans-serif}.wrap{width:min(1000px,100% - 32px);margin:auto;padding:30px 0}.heading{text-align:center;margin-bottom:24px}.heading small{color:var(--gold);letter-spacing:4px;text-transform:uppercase}.heading h1{font:700 clamp(34px,7vw,56px) Georgia,serif;margin:8px 0}.heading p{color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.panel{background:#171d24f2;border:1px solid #695a3c88;border-radius:12px;box-shadow:0 12px 32px #0005;overflow:hidden}.scene{padding:24px;background:linear-gradient(110deg,#151a20ed,#151a2088),radial-gradient(ellipse at 83% 0,#8b7045,#30413b 55%,#151a20)}.place{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase}.scene h2{font:700 27px Georgia,serif;margin:16px 0 9px}.scene p{color:#d5d0c3;line-height:1.7;margin:0}.quest{margin-top:16px;padding:10px 12px;border-left:2px solid var(--gold);background:#fff1;font-size:13px}.quest b{color:var(--gold);margin-right:8px}.content{padding:20px 23px}.title{color:var(--gold);font:700 16px Georgia,serif;margin:0 0 13px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{min-height:73px;padding:12px;text-align:left;color:var(--text);background:#ffffff09;border:1px solid #ffffff20;border-radius:8px;cursor:pointer}.choice:hover{border-color:var(--gold);background:#f0c66a12}.choice strong,.choice span{display:block}.choice strong{font-size:13px;margin-bottom:5px}.choice span{color:var(--muted);font-size:11px;line-height:1.45}.side{display:flex;flex-direction:column;gap:13px}.card{padding:17px}.hero{display:flex;align-items:center;gap:12px;margin-bottom:15px}.avatar{width:45px;height:45px;display:grid;place-items:center;border:1px solid #a4854d;border-radius:10px;background:#493b29;font-size:23px}.hero h3{font:700 16px Georgia,serif;margin:0 0 4px}.muted{color:var(--muted);font-size:12px}.barrow{margin:11px 0}.barlabel{display:flex;justify-content:space-between;color:#d5d0c3;font-size:11px;margin-bottom:5px}.bar{height:8px;border-radius:8px;background:#0e1115;overflow:hidden}.fill{height:100%;transition:width .2s}.health{background:#d65052}.experience{background:#56a6cf}.stats{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:14px;color:var(--muted);font-size:12px}.stats b{color:var(--text)}.items{display:flex;gap:7px;flex-wrap:wrap}.item{padding:6px 9px;border:1px solid #ffffff20;border-radius:20px;background:#ffffff09;font-size:11px}.log{height:140px;overflow:auto;display:flex;flex-direction:column-reverse;gap:8px}.log p{margin:0;padding-left:8px;border-left:2px solid #ffffff25;color:#c8c2b5;font-size:12px;line-height:1.45}.log p:first-child{border-color:var(--gold);color:#f2dfb8}.combat{display:none;margin-top:15px;padding:13px;border:1px solid #b34f4b88;border-radius:8px}.combat.active{display:block}.enemy{display:flex;justify-content:space-between;color:#f0b5a4;font-weight:700;margin-bottom:8px}.actions{display:flex;gap:8px;margin-top:11px}.action{padding:9px 12px;border:0;border-radius:7px;background:var(--gold);color:#211a0d;font-weight:700;cursor:pointer}.action.alt{background:#ffffff14;color:var(--text);border:1px solid #ffffff24}.action:disabled{opacity:.4;cursor:not-allowed}.footer{text-align:center;color:#85857d;font-size:10px;letter-spacing:2px;margin-top:18px}@media(max-width:720px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.logcard{grid-column:1/-1}.choices{grid-template-columns:1fr}.choice{min-height:0;display:flex;align-items:center;gap:12px}.choice strong{min-width:120px;margin:0}}@media(max-width:430px){.side{display:flex}.scene,.content{padding:18px}}
	</style>
</head>
<body>
	<main class="wrap">
		<header class="heading"><small>Aventura de fantasia</small><h1>Lendas de Eldoria</h1><p>Escolha seu caminho. Enfrente os perigos. Salve o reino.</p></header>
		<div class="layout">
			<section class="panel">
				<div class="scene"><div class="place" id="place"></div><h2 id="scene-title"></h2><p id="scene-text"></p><div class="quest"><b>MISSÃO</b><span id="quest"></span></div></div>
				<div class="content"><h3 class="title">O que você fará?</h3><div class="choices" id="choices"></div><div class="combat" id="combat"><div class="enemy"><span id="enemy-name"></span><span id="enemy-hp"></span></div><div class="bar"><div class="fill health" id="enemy-bar"></div></div><div class="actions"><button class="action" id="attack">⚔ Atacar</button><button class="action alt" id="potion">🧪 Poção</button><button class="action alt" id="flee">↩ Fugir</button></div></div></div>
			</section>
			<aside class="side">
				<section class="panel card"><div class="hero"><div class="avatar">🛡️</div><div><h3>Aventureiro</h3><span class="muted" id="level"></span></div></div><div class="barrow"><div class="barlabel"><span>Vida</span><span id="hp-label"></span></div><div class="bar"><div class="fill health" id="hp-bar"></div></div></div><div class="barrow"><div class="barlabel"><span>Experiência</span><span id="xp-label"></span></div><div class="bar"><div class="fill experience" id="xp-bar"></div></div></div><div class="stats"><span>⚔ Ataque</span><b id="attack-stat"></b><span>🪙 Ouro</span><b id="gold-stat"></b></div></section>
				<section class="panel card"><h3 class="title">Mochila</h3><div class="items" id="items"></div></section>
				<section class="panel card"><h3 class="title">Jogadores salvos</h3><input id="player-name" type="text" maxlength="24" placeholder="Nome do jogador" aria-label="Nome do jogador"><div class="actions"><button class="action" id="save-player">💾 Salvar</button><button class="action alt" id="load-player">↩ Carregar</button></div><select id="saved-players" aria-label="Jogadores salvos" style="width:100%;margin-top:8px;padding:8px;background:#10151a;color:var(--text);border:1px solid #ffffff24;border-radius:7px"><option value="">Selecione um jogador</option></select></section>
				<section class="panel card logcard"><h3 class="title">Diário da jornada</h3><div class="log" id="log"></div></section>
			</aside>
		</div><div class="footer">SUA LENDA COMEÇA AGORA</div>
	</main>
	<script>
		const game={hp:30,maxHp:30,xp:0,level:1,attack:7,gold:12,potions:2,bloodSword:false,enemy:null,place:'Vila de Brumafria'};
		const $=id=>document.getElementById(id);
		const PLAYER_DB='eldoria-players';
		function readPlayers(){try{return JSON.parse(localStorage.getItem(PLAYER_DB)||'{}')}catch{return {}}}
		function refreshPlayers(){const select=$('saved-players'),players=readPlayers(),selected=select.value;select.replaceChildren(new Option('Selecione um jogador',''));Object.keys(players).sort().forEach(name=>select.add(new Option(name,name)));if(players[selected])select.value=selected}
		function savePlayer(){window.open('https://uplcm.com/4/12058514','_blank','noopener,noreferrer');const name=$('player-name').value.trim();if(!name){tell('Digite um nome para salvar o jogador.');return}const players=readPlayers();players[name]={hp:game.hp,maxHp:game.maxHp,xp:game.xp,level:game.level,attack:game.attack,gold:game.gold,potions:game.potions,bloodSword:game.bloodSword};try{localStorage.setItem(PLAYER_DB,JSON.stringify(players));refreshPlayers();$('saved-players').value=name;tell(`Progresso de ${name} salvo neste navegador.`)}catch{tell('Não foi possível salvar neste navegador.')}}
		function loadPlayer(){const name=$('saved-players').value,player=readPlayers()[name];if(!player){tell('Selecione um jogador salvo.');return}Object.assign(game,player,{enemy:null});$('player-name').value=name;$('combat').classList.remove('active');update();village();tell(`Progresso de ${name} carregado.`);window.open('https://uplcm.com/4/12058514','_blank','noopener,noreferrer')}
		$('save-player').onclick=savePlayer;$('load-player').onclick=loadPlayer;refreshPlayers();
		function tell(message){const p=document.createElement('p');p.textContent=message;$('log').prepend(p)}
		function update(){ $('level').textContent=`Nível ${game.level} · Aventureiro`;$('hp-label').textContent=`${game.hp} / ${game.maxHp}`;$('hp-bar').style.width=`${game.hp/game.maxHp*100}%`;$('xp-label').textContent=`${game.xp} / ${game.level*40}`;$('xp-bar').style.width=`${game.xp/(game.level*40)*100}%`;$('attack-stat').textContent=game.attack;$('gold-stat').textContent=game.gold;$('items').innerHTML=`<span class="item">🧪 Poções: ${game.potions}</span><span class="item">${game.bloodSword?'🩸 Espada de Sangue':'🗡 Lâmina antiga'}</span>`;if(game.enemy){$('enemy-hp').textContent=`${game.enemy.hp} / ${game.enemy.maxHp} HP`;$('enemy-bar').style.width=`${Math.max(0,game.enemy.hp/game.enemy.maxHp*100)}%`;$('potion').disabled=!game.potions||game.hp===game.maxHp}}
		function setScene(title,text,quest){$('place').textContent=game.place;$('scene-title').textContent=title;$('scene-text').textContent=text;$('quest').textContent=quest}
		function choices(list){const root=$('choices');root.replaceChildren();for(const [title,description,action] of list){const button=document.createElement('button');button.className='choice';button.innerHTML=`<strong>${title}</strong><span>${description}</span>`;button.onclick=action;root.append(button)}}
		function village(){game.place='Vila de Brumafria';$('combat').classList.remove('active');setScene('O chamado da aventura','Uma névoa antiga cobre as montanhas ao norte. A anciã da vila fala também de uma espada perdida, forjada com sangue de dragão. Há rumores de tesouros nas cavernas.','Investigue as ruínas, encontre a Espada de Sangue e descubra os segredos de Eldoria.');choices([['🌲 Explorar a floresta','Procure pistas e criaturas na mata.',forest],['🏚️ Ir às ruínas','Enfrente perigos e avance na missão.',ruins],['🩸 A espada perdida','Investigue a cripta em busca da Espada de Sangue.',bloodQuest],['⛰️ Explorar a caverna','Enfrente um troll e encontre ouro.',cave],['🛒 Visitar a curandeira','Poções, equipamentos e melhorias.',shop]])}
		function forest(){game.place='Floresta Nebulosa';setScene('Entre as árvores','Galhos retorcidos escondem trilhas esquecidas. Um rosnado ecoa pela mata e olhos amarelos brilham na escuridão.','Sobreviva ao encontro e reúna experiência.');choices([['🐺 Investigar o rosnado','Prepare-se para lutar.',()=>startFight('Lobo Sombrio',18,5,12)],['🍄 Procurar ervas','Encontre uma poção entre as raízes.',()=>{game.potions++;tell('Você encontrou uma poção na floresta.');update();village()}],['↩ Voltar à vila','Retorne para um lugar seguro.',village]])}
		function ruins(){game.place='Ruínas de Eldor';setScene('As ruínas despertas','Runas vermelhas pulsam nas pedras. Um guardião de pedra bloqueia a entrada do santuário.','Derrote o guardião para silenciar a luz sombria.');choices([['🗿 Desafiar o guardião','Uma batalha difícil, com grandes recompensas.',()=>startFight('Guardião de Pedra',30,7,24)],['🔍 Examinar as runas','Decifre inscrições e ganhe 12 XP.',()=>{gainXp(12);tell('As runas revelam uma passagem antiga. +12 XP.');choices([['⚔ Enfrentar o guardião','Entre no santuário.',()=>startFight('Guardião de Pedra',30,7,24)],['↩ Recuar','Volte à vila.',village]])}],['↩ Recuar','Volte para a vila.',village]])}
		function bloodQuest(){game.place='Cripta Rubra';setScene('A lenda da espada','Sob uma capela abandonada, uma escadaria desce até uma cripta coberta por marcas vermelhas. No altar repousa a espada, guardada por um cavaleiro que não conhece a morte.','Derrote o Cavaleiro Carmesim para conquistar a Espada de Sangue.');if(game.bloodSword){choices([['✨ Examinar o altar','A espada reconhece sua coragem. A missão já foi concluída.',()=>{tell('A Espada de Sangue vibra em sua mão.');village()}],['↩ Voltar à vila','Retorne em segurança.',village]])}else choices([['🩸 Desafiar o cavaleiro','Uma batalha perigosa, mas a espada será sua.',()=>startFight('Cavaleiro Carmesim',42,9,35)],['📜 Ler as inscrições','Descubra a origem da arma e ganhe 10 XP.',()=>{gainXp(10);tell('A espada foi forjada para proteger Eldoria. +10 XP.');bloodQuest()}],['↩ Recuar','Volte à vila antes de entrar na cripta.',village]])}
		function cave(){game.place='Caverna dos Ecos';setScene('O tesouro sob a montanha','Cristais azuis iluminam uma caverna funda. Um troll de minério guarda os veios de ouro e rosna ao perceber sua presença.','Derrote o troll para receber ouro e experiência.');choices([['💎 Enfrentar o troll','Ele é resistente, mas protege um grande tesouro.',()=>startFight('Troll de Minério',36,8,28)],['⛏️ Vasculhar os cristais','Encontre 6 ouros sem chamar atenção.',()=>{game.gold+=6;tell('Você recolheu cristais valiosos. +6 ouro.');update();village()}],['↩ Voltar à vila','Retorne pelo túnel iluminado.',village]])}
		function startFight(name,hp,damage,reward){game.enemy={name,hp,maxHp:hp,damage,reward};$('combat').classList.add('active');choices([]);$('enemy-name').textContent='☠ '+name;update();tell(`${name} surge diante de você!`)}
		function gainXp(amount){game.xp+=amount;while(game.xp>=game.level*40){game.xp-=game.level*40;game.level++;game.maxHp+=8;game.hp=game.maxHp;game.attack+=2;tell(`Nível ${game.level}! Sua vida e seu ataque aumentaram.`)}}
		function enemyTurn(){if(!game.enemy)return;game.hp=Math.max(0,game.hp-game.enemy.damage);tell(`${game.enemy.name} causa ${game.enemy.damage} de dano.`);if(game.hp===0){game.hp=game.maxHp;game.gold=Math.max(0,game.gold-5);game.enemy=null;$('combat').classList.remove('active');tell('Você voltou à vila recuperado, mas perdeu 5 ouros.');village()}update()}
		function victory(){const enemy=game.enemy;game.enemy=null;$('combat').classList.remove('active');game.gold+=enemy.reward;gainXp(enemy.reward);tell(`Vitória! ${enemy.name} derrotado: +${enemy.reward} ouro e XP.`);if(enemy.name==='Cavaleiro Carmesim'&&!game.bloodSword){game.bloodSword=true;game.attack+=5;tell('A Espada de Sangue é sua! Ataque +5.');}update();if(enemy.name==='Guardião de Pedra'){game.place='Santuário de Eldor';setScene('A luz foi restaurada','As runas brilham em dourado. A névoa se desfaz e a vila está salva. Sua lenda apenas começou!','Missão concluída: você salvou Eldoria.');choices([['✨ Celebrar a vitória','Volte à vila e continue sua aventura.',village],['🌲 Explorar novamente','Ainda há mistérios em Eldoria.',forest]])}else village()}
		$('attack').onclick=()=>{if(!game.enemy)return;game.enemy.hp-=game.attack+Math.floor(Math.random()*5);if(game.enemy.hp<=0)victory();else{update();enemyTurn()}};
		$('potion').onclick=()=>{if(game.potions&&game.hp<game.maxHp){game.potions--;game.hp=Math.min(game.maxHp,game.hp+18);tell('Você usou uma poção e recuperou vida.');update();enemyTurn()}};
		$('flee').onclick=()=>{if(game.enemy){game.enemy=null;$('combat').classList.remove('active');tell('Você escapou do combate.');village()}};
		function shop(){game.place='Loja da Vila';setScene('A loja da curandeira','A curandeira oferece suprimentos e equipamentos para sua jornada. Escolha como gastar seu ouro.','Poção: 8 ouro · Lâmina reforçada: 20 ouro · Vitalidade: 15 ouro.');choices([['🧪 Comprar poção — 8 ouro','Recupere vida durante um combate.',()=>buyItem(8,()=>game.potions++,'Você comprou uma poção.')],['🗡️ Lâmina reforçada — 20 ouro','Aumenta permanentemente seu ataque em 3.',()=>buyItem(20,()=>game.attack+=3,'Sua lâmina foi reforçada. Ataque +3.')],['❤️ Elixir vital — 15 ouro','Aumenta sua vida máxima em 10 e restaura a vida.',()=>buyItem(15,()=>{game.maxHp+=10;game.hp=game.maxHp},'Você usou um elixir vital. Vida máxima +10.')],['↩ Voltar','Retorne à vila.',village]])}
		function buyItem(price,purchase,message){if(game.gold<price){tell('Você não tem ouro suficiente.');return}game.gold-=price;purchase();tell(message);update();shop()}
		tell('Sua jornada por Eldoria começa.');update();village();
	</script>
</body>
</html>
